[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-bridge"
version = "0.1.0"
description = "A constrained stdio MCP bridge to an Orca coordinator"
requires-python = ">=3.10"
dependencies = ["mcp>=1.20,<2"]
license = "MIT"
readme = "README.md"

[project.scripts]
orca-bridge-mcp = "orca_bridge.server:main"

[tool.setuptools.packages.find]
include = ["orca_bridge*"]
